<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width">
		<title>Skin and Bones tribute</title>
		<link rel="stylesheet" type="text/css" href="skinandbones.css">
	</head>
	<body>
	<div id="container">
		<button id="skin"><img src="skin.png"/></button>
		<button id="bones"><img src="bones.png"/></button>
	</div>
	<svg
	 id="holyman"
	 viewBox="0 0 136.44171 189.13427"
	 version="1.1"
	 xmlns:xlink="http://www.w3.org/1999/xlink"
	 xmlns="http://www.w3.org/2000/svg">
	<g
		 id="layer1"
		 transform="translate(-26.700865,-109.11216)">
		<rect
		style="fill:#68b6e1;fill-opacity:1;"
		id="rect38565"
		width="21.562092"
		height="112.44863"
		x="83.657661"
		y="109.52096" />
		<g
			 id="g29931-6"
			 transform="translate(0.18459608,0.23776011)">
			<use
				 x="0"
				 y="0"
				 xlink:href="#g11403-5"
				 id="use11405-7"
				 transform="matrix(-1,0,0,1,189.84344,0)"
				 width="100%"
				 height="100%" />
			<g
				 id="g11403-5">
				<path
					 style="fill:#68b6e1;fill-opacity:1;"
					 d="m 70,181.11257 10,10 H 95.05 V 109.11216 H 70 Z"
					 id="path857-3" />
				<path
					 style="fill:#68b6e1;fill-opacity:1;"
					 id="path9288-5"
					 transform="matrix(0.24687659,-0.09516452,0.09516452,0.24687659,-25.386728,53.59537)"
					 d="m 220.01793,499.07195 -52.05322,-52.09 52.08999,-52.05322 52.05323,52.08999 z" />
				<path
					 d="m 73.591349,138.00184 7.769131,-4.55298 8.046118,3.1198 -8.477138,4.16326 z"
					 id="eye" />
				<path
					 style="fill:#ffb8e6;fill-opacity:1;"
					 d="m 95.038561,119.10163 -5.486876,-2.31347 5.491754,2.31347 z"
					 id="halfthirdeye">
					<animate
						id="halfopen"
					    attributeName="d"
					    attributeType="XML"
						to="m 95.038561,117.10163 -5.486876,-0.22013 5.491754,2.31347 z"
					    begin="indefinite"
					    dur="1s"
					    fill="freeze"
					    />

					<animate
						id="fullyopen"
					    attributeName="d"
					    attributeType="XML"
					    to="m 95.038561,114.4558 -5.486876,2.4257 5.491754,2.31347 z"
					    begin="indefinite"
					    dur="1s"
					    fill="freeze"
					    />

					 </path>
				<path
					 style="fill:#3b4a53;fill-opacity:1;s"
					 d="m 66.725035,153.55746 -2.451407,11.12305 4.800852,0.0177 z"
					 id="path10708-1" />
				<path
					 id="rect12675-2"
					 style="fill:#68b6e1;stroke-width:2;"
					 d="m 79.766,179.47083 15.234,-0.1 v 35.37334 H 79.565979 C 82.3263,203.16278 82.248864,191.05222 79.766,179.47083 Z" />
				<path
					 style="fill:none;stroke:#3b4a53;stroke-width:1.06500005;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-dasharray:1.06500005,2.1300001;stroke-dashoffset:0.21300001;stroke-opacity:1"
					 d="m 74.773104,134.58718 c 0,0 0,0 14.472142,-5.9114"
					 id="path15447-7" >
					 <animate
						id="rise"
					    attributeName="d"
					    attributeType="XML"
					    to="m 74.773104,134.58718 c 2.888285,-10.3666 9.757677,-15.2032 14.472142,-5.9114"
					    begin="indefinite"
					    dur="10s"
					    fill="freeze"
					    />
					  <animate
						id="lower"
					    attributeName="d"
					    attributeType="XML"
					    to="m 74.773104,134.58718 c 0,0 0,0 14.472142,-5.9114"
					    begin="indefinite"
					    dur="10s"
					    fill="freeze"
					    />

					 </path>
				<path
					 id="rect24060-0"
					 style="fill:#35637f;stroke-width:1.065;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:2.81764;stop-color:#000000"
					 d="m 47.298868,246.84693 52.178635,-13.90911 -3.873908,65.3086 -68.90273,-0.24043 z" />
				<path
					 id="rect19113-9"
					 style="fill:#3b4a53;stroke-width:1.065;stroke-dashoffset:0.7455;stop-color:#000000"
					 d="m 79.565979,214.74417 16.293507,-0.5749 v 33.02244 H 44.028 c 9.910202,-16.89362 17.895599,-33.25209 35.537979,-32.44754 z" />
				<path
					 id="tear"
					 style="fill:#ffd191;stroke-width:2;stop-color:#000000"
					 d="m 76.525246,138.61639 h 3.474753 v 0 l -3.474753,0 z">
					<animate
						id="cry"
					    attributeName="d"
					    attributeType="XML"
					    from="m 76.525246,138.61639 h 3.474753 v 0 l -3.474753,0 z"
						to="m 76.525246,138.61639 h 3.474753 v 1000.49618 l -3.474753,-3.45 z"
						begin="indefinite"
					    dur="35s"
					    fill="freeze"
					    calcMode="spline"
			           keyTimes="0;1" keySplines="0.42 0 1 1"
					    />
				</path>
			</g>
			<rect
				 style="fill:#3b4a53;fill-opacity:1;"
				 id="rect26505-3"
				 width="31.165197"
				 height="87.91571"
				 x="4.0648267"
				 y="227.81192"
				 transform="matrix(1,0,0.33381676,0.94263799,0,0)" />
		</g>
	</g>
</svg>

	<audio id="bonesAudio" src="bones.mp3"></audio>
	<audio id="skinAudio" src="skin.mp3"></audio>

	<script>
		document.addEventListener('DOMContentLoaded', () =>
		{
			var skin = document.getElementById("skin");
			var bones = document.getElementById("bones");
			var skinAudio = document.getElementById('skinAudio');
			var bonesAudio = document.getElementById('bonesAudio');

			var holyman = document.getElementById("holyman");
			var holyman_eye = holyman.getElementById("eye");
			var holyman_tear = holyman.getElementById("tear");
			var holyman_h3rdeye = holyman.getElementById("halfthirdeye");
			var holyman_brow = holyman.getElementById("eyebrow");

			var watching;

			skin.addEventListener('click', () =>
			{
				if(watching != skin)
				{
					document.body.style.backgroundColor = '#DDDD88FF';
					holyman_h3rdeye.style.fill = '#ffb8e6';
					holyman.getElementById("halfopen").beginElement();
					holyman.getElementById("lower").beginElement();
					holyman_eye.style.fill = '#ffb8e6';
					holyman_tear.style.fillOpacity = 0;

					bonesAudio.load();
					skinAudio.play();

					skin.style.opacity = 1;
					bones.style.opacity = 0.5;

					watching = skin;
				}

			});

			bones.addEventListener('click', () =>
			{
				if(watching != bones)
				{
					document.body.style.backgroundColor = '#440000FF';
					holyman_h3rdeye.style.fill = '#ffd191';
					holyman.getElementById("fullyopen").beginElement();
					holyman.getElementById("rise").beginElement();
					holyman_eye.style.fill = '#ffd191';
					holyman_tear.style.fillOpacity = 1;
					holyman.getElementById("cry").beginElement();

					skinAudio.load();
					bonesAudio.play();

					skin.style.opacity = 0.5;
					bones.style.opacity = 1;

					watching = bones;
				}
			});
		});

	</script>

	</body>
</html>
